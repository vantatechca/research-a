# render.yaml — peptide-brain workers Blueprint
#
# Deploys 3 resources:
#   1. peptidebrain-api          → FastAPI (/trigger, /status, /health)
#   2. peptidebrain-worker       → Celery worker WITH embedded beat (-B, solo pool)
#   3. peptidebrain-redis        → Key Value (Valkey) broker + result backend
#
# NOTE: beat is no longer a separate service. The worker runs it in-process
# via the `-B` flag baked into the Dockerfile CMD. The solo pool keeps the
# worker inside the Starter plan's 512MB ceiling. Do NOT re-add a standalone
# beat service AND keep `-B` — two schedulers = every scheduled task fires twice.
#
# ─────────────────────────────────────────────────────────────
# BEFORE YOU DEPLOY — edit these:
#   • repo:       point to the repo containing api.py / celery_app.py / Dockerfile
#   • rootDir:    path inside the repo to the folder with the Dockerfile
#   • region:     match whatever region peptidebrain.onrender.com already runs in
#
# AFTER FIRST DEPLOY:
#   • Render will prompt you for every `sync: false` env var in the dashboard.
#     Paste your Neon DATABASE_URL, MASTER_ENCRYPTION_KEY, and all API keys
#     there — never commit them to this file.
#   • Set FRONTEND_URL on peptidebrain-api to your deployed Next.js URL so prod
#     browser requests pass CORS (api.py only allows localhost:3000 otherwise).
# ─────────────────────────────────────────────────────────────

envVarGroups:
  - name: peptidebrain-shared
    envVars:
      # Database — paste Neon connection string in dashboard
      - key: DATABASE_URL
        sync: false

      # Decrypts the AES-256-GCM API keys stored in the `api_keys` table.
      # REQUIRED — without it utils/api_keys.py cannot decrypt any provider
      # key, so get_api_key("anthropic") returns None and the AI pipeline
      # silently produces empty output. Hex (64 chars) or base64 (32 bytes).
      - key: MASTER_ENCRYPTION_KEY
        sync: false

      # AI — Anthropic Claude (the bulk/cheap model; switched off OpenRouter).
      # ANTHROPIC_API_KEY is the env fallback; the DB key_table takes priority
      # when present (and MASTER_ENCRYPTION_KEY is set).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-haiku-4-5-20251001

      # Embeddings — OpenAI-compatible endpoint for pgvector dedup (1536-dim).
      - key: EMBEDDINGS_API_KEY
        sync: false
      - key: EMBEDDINGS_API_URL
        value: https://api.openai.com/v1
      - key: EMBEDDINGS_MODEL
        value: text-embedding-3-small

      # External APIs
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SERP_API_KEY
        sync: false
      - key: SERP_API_PROVIDER
        value: serper
      - key: ETSY_API_KEY
        sync: false

      # Shared token between Next.js and the workers FastAPI service.
      # MUST be set with the same value on both peptidebrain-api and the
      # Next.js service. Without it, /api/scrape/trigger returns 503.
      - key: WORKER_API_TOKEN
        sync: false

services:
  # ─── 1. FastAPI — the trigger/status endpoint your Next.js UI calls ───
  # The Dockerfile CMD is the worker command, so the API service overrides it.
  - type: web
    name: peptidebrain-api
    runtime: docker
    repo: https://github.com/vantatechca/research-a    # ← change if workers live elsewhere
    rootDir: workers                                    # ← change if Dockerfile is at repo root
    region: oregon                                      # ← MUST match existing services + Neon region
    plan: starter                                       # $7/mo. Free tier sleeps after 15min, unusable for this.
    dockerCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - fromGroup: peptidebrain-shared
      # CORS allow-list origin for the deployed Next.js frontend. Read by
      # api.py — without it, only localhost:3000 is allowed in prod.
      - key: FRONTEND_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: peptidebrain-redis
          property: connectionString

  # ─── 2. Celery worker + embedded beat — runs scrapes AND schedules them ───
  # No dockerCommand here ON PURPOSE: the Dockerfile CMD is the single source
  # of truth (`celery -A celery_app worker -B --loglevel=info --pool=solo`).
  # Leaving it unset prevents this blueprint from drifting out of sync with
  # the image again. Solo pool fits the 512MB Starter ceiling; -B embeds beat.
  - type: worker
    name: peptidebrain-worker
    runtime: docker
    repo: https://github.com/vantatechca/research-a
    rootDir: workers
    region: oregon
    plan: starter                                       # bump to standard if the queue backs up
    numInstances: 1                                     # ⚠ keep at 1 — embedded beat means 2 instances = double-fired tasks
    envVars:
      - fromGroup: peptidebrain-shared
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: peptidebrain-redis
          property: connectionString

  # ─── 3. Key Value (Valkey / Redis-compatible) — Celery broker + result backend ───
  - type: keyvalue
    name: peptidebrain-redis
    region: oregon
    plan: starter              # $10/mo, persists to disk. Free tier loses data on restart.
    maxmemoryPolicy: noeviction  # Critical: prevents Redis from dropping queued tasks under pressure.
    ipAllowList: []            # Empty list = internal access only. Services in same region connect privately.